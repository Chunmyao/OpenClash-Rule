# ==================== 自建节点 ====================
# 已填入当前 Hysteria2 节点密码，请勿公开分享本文件
proxies:
  - name: YOUR-HY2-NODE
    type: hysteria2
    server: YOUR_SERVER_ADDRESS
    port: YOUR_SERVER_PORT
    password: "YOUR_HYSTERIA2_PASSWORD"
    sni: YOUR_TLS_SNI
    skip-cert-verify: false
    udp: true

# ==================== 核心配置 ====================
# 基础配置
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'off'
keep-alive-interval: 15
keep-alive-idle: 600
# global-client-fingerprint: chrome

# 实验性功能
experimental:
  quic-go-disable-gso: true  
     
# 管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: "CHANGE_ME_API_SECRET"

# 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN模式配置
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS配置
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "+.pub.3gppnetwork.org"
    - "+.push.apple.com"
    - "+.bing.com"
    - rule-set:Direct
    - rule-set:Private
    - rule-set:China
  use-hosts: true
  respect-rules: true
  # 引导：解析上游 DoH/DoT 的起始 DNS
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  # 代理路径用的国外上游（仅对需代理的非直连规则集域名）
  nameserver:
    - "https://cloudflare-dns.com/dns-query"
    - "https://dns.google/dns-query"
  # 直连路径专用上游（国内 DoH）
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  # 解析代理服务器的域名，防循环用国内
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  # 配置查询访问域名使用的服务器
  nameserver-policy:
    "rule-set:Advertising,AWAvenueAds": rcode://success
    # 直连类规则集匹配的域名绑定国内上游，首跳即国内，不触发国外→国内回切
    "rule-set:Direct,Private,China":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "rule-set:Speedtest,Twitter,Telegram,SocialMedia,NewsMedia,Games,Crypto,Emby,Netflix,YouTube,Streaming,Apple,Google,Microsoft,Proxy":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query

# ==================== 代理策略组 ====================
# 单节点稳定版：保留上游规则所需的策略组名称，避免无节点地区组为空
proxy-groups:
  - {name: 默认代理, type: select, proxies: [YOUR-HY2-NODE, 直接连接]}
  - {name: 故障转移, type: fallback, proxies: [YOUR-HY2-NODE, DIRECT], url: 'https://www.gstatic.com/generate_204', interval: 300, lazy: true}
  - {name: 国外流量, type: select, proxies: [默认代理, YOUR-HY2-NODE, 直接连接]}
  - {name: 国内流量, type: select, proxies: [直接连接, 默认代理]}
  - {name: 兜底流量, type: select, proxies: [直接连接, 默认代理]}
  - {name: 直接连接, type: select, proxies: [DIRECT]}
  - {name: 全球手动, type: select, proxies: [YOUR-HY2-NODE, DIRECT]}
  - {name: 日本策略, type: select, proxies: [YOUR-HY2-NODE, 默认代理]}
  - {name: 香港策略, type: select, proxies: [默认代理, DIRECT]}
